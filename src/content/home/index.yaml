heroDescription: |-
  I'm a visual designer with a strong UX/UI foundation, working at the intersection of visual craft and product thinking. I'm currently a Visual Designer at Huge, partnering with Google on the Google Ads for Search design system, where I build frameworks that help design teams deliver faster and more consistently.

  Over the past 7+ years, I've designed B2C experiences and apps for Google, Android, Google for Education, the 2024 Olympic Games, and Rockwell Automation, including web experiences that reach more than 15 million visits a month.

  Along the way, I've led projects end to end as the main designer, from discovery workshops with stakeholders to final delivery, for Universidad EAFIT and for EPM at SoftwareONE. Working across US and LATAM corporates and global design agencies has taught me to adapt quickly, collaborate across disciplines, and ground every decision in clear design rationale tied to user needs.

  My superpower is turning abstract ideas into tangible, polished deliverables, while constantly exploring how AI can expand what designers can do. My guiding principle: tools change, but the right approach doesn't. Great design comes from how you frame the problem, not from which tool or model you use.
