bio: |
  **Design, community, and continuous learning**

  I’ve always been drawn to both technology and creativity. I studied visual arts and entered the tech world through a bootcamp, which led me to my first role as a UX/UI designer at SoftwareOne. Later, I expanded into the international market, working as a Senior UI Interface Designer at Rockwell Automation and now at Huge, where I’ve had the opportunity to collaborate with Google for almost five years.

  Along the way, I’ve given talks on design, contributed to local tech communities, and volunteered to inspire new talent to explore the world of technology.

  More than 6 years of experience working for brands, crafting digital products, and interactive experiences.
