body:
  - discriminant: textMedia
    value:
      theme: light
      title: Humanizing a
      titleMuted: technical story
      body: |-
        The main challenge was turning a complex, technical issue, how Android and iPhone users communicate, into a story that felt human and easy to grasp.

        The goal was to create a clear narrative that moved naturally from problem to solution, using strong visual design and relatable imagery to connect emotionally with users. Every element, from color and layout to visual design, was crafted to balance clarity and emotion while bringing Android’s personality to life in a fresh, modern way.
