title: Android – Get the Message campaign
client: Android / Google
year: '2023'
summary: Leading the UX and UI of the campaign site that helped push universal messaging between Android and iPhone through the RCS standard.
subtitle: Turning a complex technical issue into a human, emotional and visually engaging story
intro: |-
  Get The Message is an initiative by Android/Google designed to highlight the limitations of cross-platform messaging between Android and iPhone and to advocate for the adoption of the RCS (Rich Communication Services) standard.

  In this redesigned version, my role focused on leading the user experience and interface design of the main campaign site — translating a complex technical issue into a human, emotional, and visually engaging story that connects with users while aligning with Android’s brand system.
