      titleMuted: from the client
      body: “Wanted to shout out the ANDROID team, specifically the folks that have been working on the campaign-related work that saw us push into new process, new ways of working, rapid turn around and an endlessly flexible approach to delivering value to the client on the timeline they gave us. With the recent announcement that Apple will be supporting RCS messaging protocol next year - it seems they GOT THE MESSAGE (in small part to us, also European regulators). This team really rallied. Now we’re pivoting (again) to deliver a softened launch without harder-hitting messaging. MISSION ACCOMPLISHED. Such an exciting and incredible milestone! Kudos to the countless Hugers here who were part of this journey!”
