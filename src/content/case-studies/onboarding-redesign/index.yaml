      text: The problem
      eyebrow: 01 — Context
      anchorInNav: true
  - discriminant: richText
    value: |
      Two thirds of new accounts never reached the second session. The team
      assumed the signup form was too long. The research said something else.
  - discriminant: quote
    value:
      quote: I didn't know what this was supposed to do for me yet.
      attribution: Participant 4
      role: Usability study, week 2
  - discriminant: sectionHeading
    value:
      text: What we changed
      eyebrow: 02 — Design
      anchorInNav: true
  - discriminant: richText
    value: |
      We replaced the setup wizard with a first-run workspace that was already
      populated, so the product could demonstrate its value before asking for
      configuration.
