      title: Defining the
      titleMuted: core system
      body: >-
        The main challenge was to build a design system from the ground up. The
        team defined the foundations — color, typography, grid, spacing, and
        elevation — and later expanded into navigation, footers, buttons, icons,
        and pagination. Each element was documented with clear specifications,
        accessibility standards, and real use cases, creating a single source of
        truth for Android teams.
