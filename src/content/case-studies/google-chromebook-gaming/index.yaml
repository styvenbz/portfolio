      items:
        - marker: ''
          heading: A more aspirational tone
          body: >-
            The new design brought a more engaging, aspirational tone — using
            hero images, visual context (game imagery, devices in use), and
            cinematic layouts to underscore the gaming potential.
        - marker: ''
          heading: Brand continuity with gaming flair
          body: >-
            Visual continuity with Google’s brand language plus bespoke gaming
            flair helped elevate the page’s perceived value and relevance to
            gaming audiences.
        - marker: ''
          heading: Stronger conversion potential
          body: >-
            The redesign contributed to stronger conversion potential by
            reducing friction in understanding features, improving emotional
            resonance, and supporting marketing efforts across Google’s
            ecosystem.
