subtitle: Designing the future of cloud gaming
intro: >-
  Redesigned the Google Chromebook (Google for Gaming) landing experience to
  better align messaging, visual identity, and user engagement, transforming a
  technically driven product page into a compelling, human-forward platform that
  communicates the power and possibilities of Chromebook for gaming.
