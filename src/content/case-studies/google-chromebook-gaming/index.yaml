    value:
      theme: dark
      title: Breaking the
      titleMuted: Chromebook myth
      body: >-
        Chromebook was often seen only as a tool for work or school, not for
        gaming. The challenge was to change that perception and show that
        ChromeOS can also deliver high-quality gaming experiences.


        Starting from a UX structure, the design process included defining the
        right visual components, layout, color combinations, and imagery.
        Several visual explorations were created around different concepts,
        supported by benchmarking and market research to understand how other
        gaming brands communicate. Accessibility was an important part of the
        process, ensuring color contrast and component usability met standards.


        The final designs were delivered to developers with all assets and
        documentation prepared for implementation. The proposal was later shared
        with Google’s internal and external teams to align the creative
        direction. The project was developed in collaboration with a
        multidisciplinary team that included UX designers, visual designers,
        animators, and copywriters.


        This setup made it possible to combine different perspectives and
        skills, creating a more complete and engaging experience. Working
        closely with such a diverse team helped strengthen collaboration and
        creative alignment throughout the project.
      columns: '2'
      wideLast: false
