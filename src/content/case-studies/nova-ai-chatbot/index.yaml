title: Nova – AI Chatbot
client: Google
summary: >-
  A chatbot for Google’s SAGE designers that centralises precedents, approvals,
  context and documentation, so decisions are better informed and rework goes
  down.
subtitle: An AI guide that puts precedents, approvals and documentation a question away
intro: >-
  This project focuses on designing the UX/UI experience for a chatbot developed
  for Google’s SAGE designers. The chatbot serves as a practical guide, giving
  them quick access to previous precedents, approvals, context, and
  documentation. By centralizing this information and leveraging AI, it helps
  designers make better-informed decisions, reduce rework, and streamline their
  workflows.
keyPoints:
  - label: Challenges
    body: >-
      • Create the experience from scratch, using Google’s current AI products
      like Gemini as a reference.

      • Build a custom design system that follows good patterns and best
      practices.

      • Design the visual style for both the chatbot and its brand.

      • Help with interviews with designers, collecting their feedback during
      different rounds of changes.
  - label: Achievements
    body: >-
      Completed around 10 iteration cycles involving leaders, the client, and
      SAGE designers. MVP is nearly ready, with HUGE’s development team
      preparing to start the first phases of real testing.
