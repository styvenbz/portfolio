body:
  - discriminant: textMedia
    value:
      theme: light
      title: The idea
      titleMuted: music as a meeting point
      body: >-
        Resonate is an app that turns shared musical taste into real-life
        connections. It reads your listening habits on streaming platforms,
        finds the artists and bands you play most, and connects you with nearby
        events and with people who share your taste. You can discover an event,
        buy tickets in the app, and meet your people in person.
      media:
        discriminant: image
        value:
          src: /images/case-studies/resonate/body/0/value/media/value/src.jpg
          alt: >-
            A listener at the centre of purple rings, surrounded by artists,
            nearby people and music icons, with the Resonate logo below.
          width: 1935
          height: 1088
      width: contained
  - discriminant: list
    value:
      theme: dark
      title: Two sides
      titleMuted: of the product
      items:
        - marker: B2C
          heading: Listeners
          body: Discover real events matched to their listening habits.
        - marker: B2B
          heading: Venues and businesses
          body: >-
            Use Resonate to create events, sell tickets and bring in new
            audiences. Resonate earns a small percentage of every ticket sold.
  - discriminant: list
    value:
      theme: light
      title: The process
      titleMuted: AI at every stage
      body: I used AI at every stage, from concept to final assets.
      items:
        - heading: Concept and strategy
          body: >-
            ChatGPT to shape the idea, the business model and the brand
            narrative.
        - heading: Visual assets
          body: >-
            Nano Banana to generate and refine imagery for the brand and the
            app.
        - heading: Motion
          body: Grok to create GIFs and animated graphics for social media.
        - heading: Prototype
          body: >-
            Figma Make to turn the designs into a working, interactive
            prototype.
  - discriminant: imageGrid
    value:
      theme: dark
      title: Brand and
      titleMuted: art direction
      body: >-
        The name Resonate comes from a simple idea: when two things vibrate at
        the same frequency, they amplify each other. Music works that way, and
        so do people. The brand brings together two vibrations, the sound waves
        of music and the energy of young people, and treats the moment they meet
        as the heart of the experience.


        Waves and resonance. This idea runs through the whole identity, not only
        the name. It shows up in flowing shapes, rhythm and movement across the
        visuals, echoing the way sound travels and the way people connect when
        they share the same taste.


        Fresh. Resonate speaks to a generation that discovers music constantly,
        so the visual language had to feel current and light: clean layouts,
        generous space and imagery that feels alive rather than corporate.


        Young. The brand reflects the energy of going out, meeting new people,
        and living music in real life. Bold compositions and dynamic motion give
        it a playful, confident attitude.


        Emotional. Music is personal, and the brand had to feel that way too.
        Every visual decision aims to evoke the feeling of hearing a song you
        love or finding someone who loves it too.


        From references to an original system. I gathered visual references to
        define the direction for onboarding, color and typography. Then I used
        AI to explore, generate, and refine those ideas into an original brand
        system, from imagery and screens to motion assets for social media.
