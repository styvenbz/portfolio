title: Resonate
client: Huge · Internal AI Challenge
year: '2026'
summary: An AI-built app that connects people through the music they love.
subtitle: An AI-built app that connects people through the music they love
intro: >-
  Huge launched an internal initiative to explore how far its people could go
  with AI: design and build a product from scratch using AI as the main creative
  and production partner. Around 40 participants from offices around the world
  took part, across every level of seniority and discipline. The winners would
  get a trip to Config 2026, Figma’s annual conference in San Francisco.
keyPoints:
  - label: Recognition
    body: >-
      Selected as one of the winners among around 40 participants worldwide,
      earning a trip to Config 2026 in San Francisco.
  - label: Deliverables
    body: >-
      A complete brand identity, an interactive app prototype and motion assets
      for social media, all created with AI from scratch.
tags:
