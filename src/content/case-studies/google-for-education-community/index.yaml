      title: Bringing humanity
      titleMuted: to the system
      body: >-
        These pages had to transform dense, role-driven institutional offerings
        (for educational leaders and technology admins) into approachable
        digital experiences. The core problem: stakeholders often saw these
        communities as abstract or bureaucratic.


        My goal was to humanize them through visual storytelling and imagery,
        clarifying what value members would gain and how to engage.
