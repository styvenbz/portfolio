      body: >-
        “I wanted to take a moment to express my infinite gratitude and congrats
        Styven for his great work during the project. Styven is one of the best
        partners I’ve had the chance to work with. Every day, he motivated me to
        deliver our best work. His attention to detail is just as sharp as his
        creative skills. With each project iteration, the quality of our work
        improved significantly thanks to his strong management. Styven is also
        incredibly kind and always open to advice, creating an environment where
        we could both grow together. One of his standout strengths is his
        ability to incorporate client feedback effectively. He organizes it in a
        way that the team can easily navigate, which made my work as a partner
        smoother and more efficient. His approachability, combined with his
        talent for managing feedback, made a noticeable difference in our
        results.”


        — Associate Visual Designer at Huge, Google for Education
