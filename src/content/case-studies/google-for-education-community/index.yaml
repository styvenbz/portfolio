  - discriminant: list
    value:
      theme: dark
      title: Outcomes
      body: >-
        The redesign brought greater clarity, warmth, and cohesion to Google’s
        educator community experience, helping users quickly understand the
        value of joining while strengthening the visual identity across the
        platform.
      items:
        - marker: 11.9M
          heading: Average visits per month
          body: >-
            Both pages now form part of a unified ecosystem that attracts an
            average of 11.9 million visits per month (Similarweb, 2024–2025),
            reinforcing Google for Education’s role as a trusted global hub for
            learning and collaboration.
        - heading: A more human experience
          body: >-
            The new visual direction improved readability, consistency, and
            emotional resonance, creating a more engaging and human experience
            for educators worldwide.
